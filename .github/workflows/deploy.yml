            ${{ secrets.DOCKERHUB_USERNAME }}/rag_embedding:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  push-app-server-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app server image
        uses: docker/build-push-action@v6
        with:
          context: ./Application_layer/server
          file: ./Application_layer/server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rag_app_server:${{ inputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rag_app_server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-RAG-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
