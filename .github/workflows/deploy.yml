          context: .
          file: ./RAG_Generation/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rag_generation:${{ inputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rag_generation:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max