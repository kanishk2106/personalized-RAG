name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "PDF_event/**"
      - ".github/workflows/worker_PDF_deploy.yml"
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "PDF_event"
          wranglerVersion: "4"
          command: deploy